# ai-dev-squad — AI Dev Squad POD (Jira → groom → plan → build → QA → review → merge)
#
# A pod of digital employees + human roles that runs a software change end to
# end: a request is groomed into a well-formed ticket -> a stakeholder signs off
# scope -> the planner picks & plans -> the tech lead approves -> the developer
# (the real Claude Agent SDK) implements it -> QA independently RE-RUNS the tests
# -> the reviewer judges the diff -> the tech lead merges -> a finisher gates CI
# and does the real merge -> a WORM sink records every step.
#
# The pod is a TEAM, not a pipeline. Every wire is conditional; every hand-off is
# a finished contract; every human gate default-denies on silence (-> held ->
# audit); the finisher re-checks the human approval and fails closed; the WORM
# sink is the terminus. Systems (Jira / GitHub) are TOOLS inside agents, never
# members.
#
# Design doctrine: .claude/skills/leafmesh/building-agents-thoroughly.md
# Field reference:  .claude/skills/leafmesh/agent-config-fields.md

name: "ai-dev-squad"
version: "1.0.0"
architecture: "managed_mesh"
environment: "development"
debug: true
log_level: "INFO"

persistence:
  backend: redis
  redis:
    host: "${REDIS_HOST:localhost}"
    port: ${REDIS_PORT:6379}
    db: 0
    password: "${REDIS_PASSWORD:}"
    auto_storage: true
    decode_responses: true
    default_ttl: 86400
    session_ttl: 1209600          # 14d — tickets are long-lived

# ─────────────────────────────────────────────────────────────────────
# EVENT BROKERS — where Jira pushes events the squad listens to.
# DEV: a thin webhook receiver writes Jira "issue assigned to us" events
# into a Redis stream (same Redis, no extra dependency). PROD: point at
# your real bus (Kafka / SQS) — uncomment one and `pip install
# leafmesh[kafka]` or `[sqs]`.
# ─────────────────────────────────────────────────────────────────────
brokers:
  jira_events:
    type: "redis_streams"
    url: "${JIRA_EVENTS_REDIS_URL:redis://localhost:6379}"
    db: 1
  # PROD — Jira webhooks → SQS:
  # jira_events:
  #   type: "sqs"
  #   region: "${AWS_REGION:us-east-1}"
  # PROD — Jira webhooks → Kafka:
  # jira_events:
  #   type: "kafka"
  #   bootstrap_servers: ["${KAFKA_BOOTSTRAP:kafka:9092}"]

auto_discover:
  directory: "./agency"
  pattern: "*_agent.py"
  recursive: false

# The Manager is the SUPERVISOR — it watches every hand-off and escalates stalls
# / contract violations / repeated errors to the Tech Lead. It is NOT a router in
# the middle of the team (static routing keeps the mesh's own can_call wires in
# charge; the Manager only intervenes on trouble).
manager:
  model: "gpt-4o-mini"
  domain: "generic"
  prompt: |
    This mesh runs an autonomous software-development squad. A change flows:
    coordinator opens the case -> product_owner grooms a well-formed ticket
    (testable acceptance criteria) -> stakeholder signs off scope -> dev_planner
    picks & plans -> tech_lead approves -> developer (Claude Agent SDK) builds
    it -> qa RE-RUNS the tests independently -> code_reviewer judges the diff ->
    tech_lead merges -> merge_coordinator gates CI and does the real merge.
    Escalate to the Tech Lead when: a plan sits unreviewed past its bound, a PR
    bounces between reviewer/QA and the developer past the rework cap, the
    developer run fails to produce a PR, or any agent hands off a malformed
    artifact. Silence never advances a ticket.
  routing:
    mode: static
  escalation:
    targets:
      - type: human_agent
        agent: tech_lead_human
    auto_escalate:
      max_retries: 3
      max_errors_per_session: 5
      timeout_threshold: 2

mesh:
  call_timeout: 1800            # the developer run is long

# 2.4.131 runtime block — the developer/QA runs are external (own timeouts in
# connector_config); the LLM agents (planner with super_agent, reviewer) can run
# long, so lift the LLM hard timeout off the 2.4.131 default of 90s.
timeouts:
  llm_hard_timeout_s: 300

data_structures:
  Ticket:
    type: "object"
    properties:
      ticket_id:   { type: "string" }
      key:         { type: "string" }   # e.g. ENG-1234
      url:         { type: "string" }
      title:       { type: "string" }
      priority:    { type: "string" }
      assignee:    { type: "string" }
    required: ["assignee"]

# ─────────────────────────────────────────────────────────────────────
# ENTRY POINTS — one per real-world trigger. Multiple, on purpose.
# ─────────────────────────────────────────────────────────────────────
entry_points:
  - name: "new_request"
    target: "squad_coordinator_agent"
    description: "A stakeholder / intake form submits a raw feature request or bug report — the coordinator opens the case"
    condition: always
  - name: "delivery_status"
    target: "squad_coordinator_agent"
    description: "Anyone asks 'where is my ticket?' — the coordinator answers from the case record"
    condition: always
  - name: "ticket_assigned"
    target: "dev_planner_agent"
    description: "Jira assigned a ticket to the squad (webhook/event)"
    condition: always
  - name: "poll_assigned_tickets"
    target: "dev_planner_agent"
    description: "Cron — sweep the assigned-ticket queue and pick the next"
    condition: always
  - name: "qa_ticket_assigned"
    target: "qa_agent"
    description: "Jira assigned a QA/test ticket to the squad (label: qa)"
    condition: always
  - name: "poll_qa_tickets"
    target: "qa_agent"
    description: "Cron — sweep the assigned QA/test queue (fanned across testers)"
    condition: always
  - name: "pr_review_requested"
    target: "code_reviewer_agent"
    description: "A PR was opened/updated (GitHub webhook)"
    condition: always
  - name: "lead_reply"
    target: "tech_lead_human"
    description: "HITL resume — the tech lead answers a plan or merge gate"
    condition: always
  - name: "direct_call_po"
    target: "product_owner_agent"
    description: "Run the product owner directly (debug / replay)"
    condition: always
  - name: "direct_call_planner"
    target: "dev_planner_agent"
    description: "Run the planner directly (debug / replay)"
    condition: always
  - name: "direct_call_developer"
    target: "developer_agent"
    description: "Run the developer on an approved plan directly"
    condition: always
  - name: "direct_call_qa"
    target: "qa_agent"
    description: "Run the QA agent directly (debug / replay)"
    condition: always
  - name: "direct_call_reviewer"
    target: "code_reviewer_agent"
    description: "Run a PR review directly"
    condition: always
  - name: "direct_call_merge"
    target: "merge_coordinator_agent"
    description: "Run the CI-gate + merge finisher directly"
    condition: always

# ─────────────────────────────────────────────────────────────────────
# AGENTS
# ─────────────────────────────────────────────────────────────────────
agents:

  # ─────────────────────────────────────────────────────────────────────────
  # Squad Coordinator (AI). Owns the case end to end: opens it, orchestrates the
  # pod, keeps live status, is the requester's one contact. Pure orchestration —
  # it never grooms a ticket, writes code, or approves. (Pure YAML, like the
  # proven reference coordinator.)
  # ─────────────────────────────────────────────────────────────────────────
  squad_coordinator_agent:
    name: "squad_coordinator_agent"
    communication_type: "chain"
    agent_type: "llm"
    model: "gpt-4o-mini"
    temperature: 0.1
    description: "Squad Coordinator — opens the case, orchestrates groom→plan→build→review→merge, keeps status, single point of contact"
    prompt: |
      You are the Squad Coordinator. You OWN each change request from the moment
      it arrives to the moment it is merged. You orchestrate the pod and keep the
      requester informed — you never groom a ticket, write code, or approve
      anything yourself.

      On a new request: open a case and hand the verbatim request to the product
      owner to groom. Echo the request text in `request` so the product owner
      receives it. On a status ask: answer the current stage / waiting-on / next
      gate from the case record — nothing invented. If a specialist raises an
      exception you cannot route (a stalled gate, a malformed hand-off), escalate
      to the Tech Lead; never make the engineering call yourself.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"action": "open_case", "request": "", "ticket_ref": "", "stage": "", "waiting_on": "", "summary": ""}
    yields:
      action: "string"        # open_case | status | escalate
      request: "string"
      ticket_ref: "string"
      stage: "string"
      waiting_on: "string"
      summary: "string"
    inputs:
      request: "string"
    can_call:
      - agent: "product_owner_agent"
        condition: "calling_agent_response.action == 'open_case'"
      - agent: "tech_lead_human"
        condition: "calling_agent_response.action == 'escalate'"

  # ── PRODUCT OWNER (LLM) — upstream of the planner ───────────────
  # Turns a raw request (or a bare Jira ticket) into a WELL-FORMED ticket:
  # crisp title, description, TESTABLE acceptance_criteria (what QA checks
  # against), priority, and a QA discipline hint — dedupes it, then files
  # it to Jira (status: triage). A stakeholder signs off scope before it
  # enters the dev queue. This FEEDS the chain; it has no back-edge from it.
  product_owner_agent:
    name: "product_owner_agent"
    agent_type: "llm"
    description: "Product owner — grooms a raw request into a well-formed Jira ticket (acceptance criteria + priority + QA discipline), dedupes against the backlog, files it for the squad"
    model: "claude-sonnet-4-6"
    temperature: 0.3
    max_completion_tokens: 3000
    max_tool_calls_per_message: 10   # jira_update + on-demand playbook lookups
    communication_type: "chain"
    # Hear raw tickets created in Jira that need grooming — parallel to the
    # new_request entry point a stakeholder / intake form posts to.
    listen_events:
      - broker: "jira_events"
        stream: "jira:created"
        consumer_group: "dev-squad-po"
        filter: { type: "jira.issue.created" }
    prompt: |
      You are the product owner for a software squad.
      context["prepared_data"] carries the raw request and the titles of
      the currently-open tickets.

      Groom the request into ONE well-formed ticket:
        1. A crisp title and a clear description (problem + intent).
        2. TESTABLE acceptance_criteria — the concrete, observable
           conditions QA will verify (not "works well").
        3. priority: critical | high | medium | low.
        4. discipline: backend | api | frontend — the QA lane this needs.
        5. If it duplicates an open ticket, set duplicate_of to that title
           and ticket_ready=false. If it's too vague to groom, set
           not_actionable=true. Otherwise ticket_ready=true.

      Leave ticket_id / ticket_key / ticket_url as "" — they are filled
      when the ticket is filed. Load the `grooming` playbook for how to
      write acceptance criteria QA can actually execute against.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly
      these keys:
      {"title": "", "description": "", "acceptance_criteria": [], "priority": "medium", "discipline": "backend", "ticket_ready": false, "duplicate_of": "", "not_actionable": false, "ticket_id": "", "ticket_key": "", "ticket_url": ""}
    enforce_yields: true
    enforce_yields_retry: 2
    # Playbook — the CRAFT, fetched on demand. Only `description` rides in the
    # prompt; `responsibility` is loaded when the model recognises the intent.
    playbook:
      - intent: grooming
        description: "How to turn a raw request into a buildable, testable ticket."
        responsibility: |
          1. State the problem and the intended outcome in one or two sentences
             — not the solution. If you cannot state the problem, it is
             not_actionable.
          2. Write acceptance_criteria as observable, executable checks: a
             concrete input and the expected result, a status code, a visible UI
             state. Each criterion is something QA can RUN, pass/fail — never
             "works well" or "is fast".
          3. Pick the discipline (backend / api / frontend) from where the
             criteria are verified, so the right QA lane picks it up.
          4. Compare the title/intent against the open-ticket titles; if it is
             the same ask, set duplicate_of and do NOT file a second ticket.
        variables: [request]
    # Day-0 write tool — the LLM comments the groomed ticket onto Jira as it
    # works. The @chain guarantees the create regardless (dev: the store).
    tools: ["jira_update"]
    # ── To wire real Jira, set the URL and uncomment. NOTE: the SDK rejects an
    #    http mcp block with an EMPTY url at load, so this ships commented —
    #    fill JIRA_MCP_URL, then uncomment. Each named action under `use:`
    #    becomes its own tool (e.g. jira_create_issue). ──
    # mcp:
    #   - transport: http
    #     url: "${JIRA_MCP_URL}"
    #     token: "${JIRA_MCP_TOKEN:}"
    #     use: [create_issue, add_comment, search_issues]
    #     name: jira
    #     timeout: 30
    yields:
      title: "string"
      description: "string"
      acceptance_criteria: "list"
      priority: "string"
      discipline: "string"
      ticket_ready: "boolean"
      duplicate_of: "string"
      not_actionable: "boolean"
      ticket_id: "string"
      ticket_key: "string"
      ticket_url: "string"
    inputs:
      request: "string"
    can_call:
      - agent: "stakeholder_human"
        condition: "calling_agent_response.ticket_ready == true and calling_agent_response.duplicate_of == ''"
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.not_actionable == true or calling_agent_response.duplicate_of != ''"
    auto_store_response: true
    auto_store_yields: true

  # ── PLANNER (LLM + super_agent + playbook) ──────────────────────
  # Pulls the Jira tickets assigned to the squad, picks the best one, writes an
  # implementation plan, and pings the tech lead. super_agent = autonomous
  # plan/execute/verify over the queue; playbook = the picking + planning craft.
  dev_planner_agent:
    name: "dev_planner_agent"
    agent_type: "llm"
    description: "Planner — pulls the Jira tickets assigned to the squad, picks the best one, writes an implementation plan, pings the tech lead"
    model: "claude-sonnet-4-6"
    temperature: 0.2
    max_completion_tokens: 3000
    max_tool_calls_per_message: 15   # queue reads + planner tools + playbook; default 5 truncates silently
    communication_type: "chain"
    # Scheduled poll — every 30 min, in the company timezone (NOT UTC). Also
    # reachable via ticket_assigned / poll_assigned_tickets entry points.
    wake_up: "*/30 * * * *"
    timezone: "Asia/Kolkata"
    # ALSO hear Jira live — event-driven, parallel to the cron + entry point.
    listen_events:
      - broker: "jira_events"
        stream: "jira:assigned"
        consumer_group: "dev-squad-planner"
        filter: { type: "jira.issue.assigned" }   # CloudEvents-style; squad-assigned only
    # super_agent — DICT form (the tuning path). Registers the planner tools
    # from THIS block; do not list them under `tools:`.
    super_agent:
      cost_ceiling: 120000
      wall_clock: 900
    prompt: |
      You are the planner for an autonomous dev squad.
      context["prepared_data"] carries the tickets ASSIGNED to us, already
      pulled from Jira and sorted by priority then age (pre_compose did
      this). Reason over the real queue.

      1. PICK the best ticket to work next: highest priority, then oldest,
         then smallest effort; skip blocked / needs-info tickets. (Your
         post-processor locks the deterministic pick — propose it here.)
      2. WRITE a clear implementation plan for the picked ticket:
         approach, files likely touched, test strategy, risks.
      3. If the queue has no actionable ticket, set no_actionable_ticket=true.

      Echo ticket_id / ticket_key / ticket_url for the picked ticket. Load the
      `planning` playbook for how to size and de-risk a plan.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly
      these keys:
      {"ticket_id": "", "ticket_key": "", "ticket_url": "", "plan": "", "plan_ready": false, "no_actionable_ticket": false, "priority_rank": 0}
    enforce_yields: true
    enforce_yields_retry: 2
    playbook:
      - intent: planning
        description: "How to pick the next ticket and write a plan a coder can execute."
        responsibility: |
          1. Pick by priority, then age, then smallest effort; never pick a
             blocked or needs-info ticket — surface it instead.
          2. Write the plan as: approach (one paragraph), files likely touched,
             the test strategy that satisfies the ticket's acceptance criteria,
             and the top risks. A plan a developer can start from with no
             follow-up questions.
          3. Keep it to ONE ticket — the WIP cap is deliberate; queue the rest.
        variables: [ticket_id]
      - intent: replan
        description: "How to revise a plan after the tech lead requests changes."
        responsibility: |
          1. Read the lead's feedback threaded into the request; address each
             concern explicitly in the revised plan.
          2. Keep the same ticket; do not silently re-scope. If the feedback
             changes scope, say so in the plan.
        variables: [ticket_id]
    tools: ["jira_update"]          # write tooling — comment the plan onto the ticket at runtime
    knowledge:
      serviceName: "mongo_main"
      enabled: true
      groupName: "eng_playbook"
    # ── Real Jira MCP — ships commented (empty-url mcp is rejected at load). ──
    # mcp:
    #   - transport: http
    #     url: "${JIRA_MCP_URL}"
    #     token: "${JIRA_MCP_TOKEN:}"
    #     use: [search_issues, get_issue, transition_issue, add_comment]
    #     name: jira
    #     timeout: 30
    yields:
      ticket_id: "string"
      ticket_key: "string"
      ticket_url: "string"
      plan: "string"
      plan_ready: "boolean"
      no_actionable_ticket: "boolean"
      priority_rank: "number"
    inputs:
      ticket_id: "string"
    can_call:
      - agent: "tech_lead_human"
        condition: "calling_agent_response.plan_ready == true"
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.no_actionable_ticket == true"
    auto_store_response: true
    auto_store_yields: true

  # ── DEVELOPER — the Claude Agent SDK (EXTERNAL · claude_agent) ───
  developer_agent:
    name: "developer_agent"
    agent_type: "external"
    framework: "claude_agent"
    description: "The Claude Agent SDK — implements the approved ticket: edit, test, commit, push, open a PR, update docs"
    communication_type: "chain"
    connector_config:
      # api_key falls back to ANTHROPIC_API_KEY
      model: "claude-opus-4-8"
      system_prompt: |
        You are a senior software engineer. Implement the approved ticket
        plan in this repository. Work on a new feature branch. Read the
        codebase first; follow its conventions. Run the tests and make
        them pass. Update any affected documentation IN THE SAME PR.
        Commit with a clear message, push the branch, and open a pull
        request with `gh pr create` (title + description summarising the
        change and linking the ticket). Do not merge.
      allowed_tools: ["Read", "Edit", "Write", "Bash", "Glob", "Grep"]
      permission_mode: "acceptEdits"     # headless — no interactive prompts
      cwd: "${DEV_REPO_PATH:}"           # the repo checkout to work in
      max_turns: 40
      timeout: 1800.0
    yields:
      pr_url: "string"
      branch: "string"
      files_changed: "number"
      tests_passed: "boolean"
      summary: "string"
      ticket_id: "string"
      dev_status: "string"          # success | tests_failing | blocked_needs_info
    inputs:
      ticket_id: "string"
      plan: "string"
    can_call:
      # Fresh PR → hand to QA first (independent execution before human judgment)
      - agent: "qa_agent"
        condition: "calling_agent_response.pr_url != '' and calling_agent_response.dev_status != 'blocked_needs_info'"
      # No PR, or the agent got stuck and needs clarification → a human
      - agent: "tech_lead_human"
        condition: "calling_agent_response.pr_url == '' or calling_agent_response.dev_status == 'blocked_needs_info'"
    auto_store_response: true
    auto_store_yields: true

  # ── QA ENGINEER — Jira-driven test executor (EXTERNAL · claude_agent)
  # The independent executor. The developer self-reports "tests passed";
  # QA RE-RUNS the test cases for its discipline against the build, so a
  # false green can't reach review. It also works its OWN assigned test
  # tickets (standalone, via Jira event/cron) and files every defect back
  # into Jira as a bug — which the planner later picks up (find→fix loop).
  #
  # PARALLEL INSTANCES — one activation spins up N testers. Each copy makes an
  # ATOMIC claim in pre_compose (a fresh PR is claimed by exactly one; the
  # others drain the assigned-test backlog), so copies never duplicate work.
  # instances_handoff: each = every copy routes its OWN result (no cross-copy
  # merge footgun) via the single computed `route` field.
  qa_agent:
    name: "qa_agent"
    agent_type: "external"
    framework: "claude_agent"
    description: "QA engineer — pulls its assigned test tickets (and tests fresh PRs), runs the test cases for its discipline, files bugs back into Jira; runs as N parallel testers"
    communication_type: "chain"
    instances: 3                       # 3 parallel testers per activation
    instances_handoff: each            # each copy routes its own result (disjoint work)
    wake_up: "*/45 * * * *"            # sweep the assigned QA/test queue
    timezone: "Asia/Kolkata"
    # Hear Jira assign QA/test tickets live (label: qa), parallel to cron.
    listen_events:
      - broker: "jira_events"
        stream: "jira:qa_assigned"
        consumer_group: "dev-squad-qa"
        filter: { type: "jira.issue.assigned", label: "qa" }
    connector_config:
      # api_key falls back to ANTHROPIC_API_KEY
      model: "claude-opus-4-8"
      system_prompt: |
        You are a QA engineer. Your assigned discipline (backend, api, or
        frontend) and the test target (a ticket's acceptance criteria, and
        a PR branch when verifying a fresh build) are given in the task.
        EXECUTE the test cases for your discipline — do NOT modify
        production code or author new production tests; you VERIFY:
          - backend  → run the service and its unit/integration suites; probe edge cases and error handling.
          - api      → exercise the endpoints: status codes, response schema, auth, error paths, rate limits.
          - frontend → drive the UI in a browser; check the user flows, console errors, basic accessibility.
        For EVERY defect, record a clear title, steps to reproduce,
        expected vs actual, and severity (blocker | major | minor). Then
        return ONLY valid JSON:
        {"qa_verdict": "pass|fail", "tests_run": 0, "bugs": [{"title": "", "steps": "", "expected": "", "actual": "", "severity": "major"}]}
        Do not commit, push, or open PRs.
      allowed_tools: ["Read", "Bash", "Glob", "Grep"]
      permission_mode: "default"         # read + run only — QA never edits the repo
      cwd: "${DEV_REPO_PATH:}"
      max_turns: 30
      timeout: 1200.0
    # ── Real Jira/GitHub MCP — ships commented (empty-url mcp rejected at load). ──
    # mcp:
    #   - transport: http
    #     url: "${JIRA_MCP_URL}"
    #     token: "${JIRA_MCP_TOKEN:}"
    #     use: [search_issues, get_issue, create_issue]
    #     name: jira
    #     timeout: 30
    #   - transport: http
    #     url: "${GITHUB_MCP_URL}"
    #     token: "${GITHUB_MCP_TOKEN:}"
    #     use: [get_pull_request, get_pr_files]
    #     name: github
    #     timeout: 30
    yields:
      ticket_id: "string"
      pr_url: "string"
      discipline: "string"
      qa_verdict: "string"               # pass | fail
      qa_escalate: "boolean"             # rework cap hit → a human steps in
      from_dev_flow: "boolean"           # true = verifying a fresh PR; false = standalone test ticket
      did_work: "boolean"                # false = this copy claimed nothing (idle) → terminal, no route
      route: "string"                    # reviewer | developer | escalate | audit | "" (idle) — the single routing signal
      bugs_found: "list"
      bugs_filed: "list"                 # Jira bug keys created
      tests_run: "number"
    inputs:
      ticket_id: "string"
      pr_url: "string"
    can_call:
      # Build verified clean → on to human judgment (the LLM reviewer)
      - agent: "code_reviewer_agent"
        condition: "calling_agent_response.route == 'reviewer'"
      # Build failed QA → back to the developer to fix (bounded rework)
      - agent: "developer_agent"
        condition: "calling_agent_response.route == 'developer'"
      # Rework cap hit → a human breaks the loop
      - agent: "tech_lead_human"
        condition: "calling_agent_response.route == 'escalate'"
      # Standalone test tickets + failing rounds terminate at audit
      # (bugs filed to Jira are the output — the planner picks them up later)
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.route == 'audit'"
    auto_store_response: true
    auto_store_yields: true

  # ── CODE REVIEWER (LLM + playbook) ──────────────────────────────
  code_reviewer_agent:
    name: "code_reviewer_agent"
    agent_type: "llm"
    description: "Reads the PR diff and judges it — approve, request changes, or block; bounds the rework loop"
    model: "claude-sonnet-4-6"
    temperature: 0.1
    max_completion_tokens: 3000
    max_tool_calls_per_message: 8    # PR diff read + playbook lookups
    communication_type: "chain"
    prompt: |
      You review a pull request. context["prepared_data"] carries the PR
      diff + the ticket/plan (pre_compose pulled them from GitHub).

      Judge it:
        - verdict: approve | changes | block
          (block = a security hole, data-loss risk, or broken build;
           changes = fixable issues; approve = ship-ready)
        - findings: list of concrete issues
        - requires_senior: true for cross-cutting / public-API / security
      Your post-processor enforces the floor: a HIGH/security finding
      forces is_blocker; cross-cutting forces requires_senior; and it
      caps how many times a PR may bounce back to the developer. Load the
      `review` playbook for what to check and what forces an escalation.

      Echo pr_url, ticket_id.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly
      these keys:
      {"pr_url": "", "ticket_id": "", "verdict": "", "findings": [], "requires_senior": false, "is_blocker": false}
    enforce_yields: true
    enforce_yields_retry: 1
    playbook:
      - intent: review
        description: "What to check in a diff and what forces a block or a senior review."
        responsibility: |
          1. Read the diff against the ticket's intent: does it do what was
             asked, and only that?
          2. BLOCK (never approvable) on a security hole, a secret in the diff,
             a SQL-injection / RCE path, a data-loss risk, or a broken build.
          3. Flag for a SENIOR anything cross-cutting: a public API change, an
             auth/permission change, a schema migration, a shared-library edit.
          4. Everything else fixable is `changes` with concrete findings — the
             developer must be able to act on each one.
        variables: [pr_url]
    # ── Real GitHub MCP — ships commented (empty-url mcp rejected at load). ──
    # mcp:
    #   - transport: http
    #     url: "${GITHUB_MCP_URL}"
    #     token: "${GITHUB_MCP_TOKEN:}"
    #     use: [get_pull_request, get_pr_diff, get_pr_files]
    #     name: github
    #     timeout: 30
    yields:
      pr_url: "string"
      ticket_id: "string"
      verdict: "string"
      findings: "list"
      requires_senior: "boolean"
      is_blocker: "boolean"
    inputs:
      pr_url: "string"
      ticket_id: "string"
    can_call:
      - agent: "tech_lead_human"
        condition: "calling_agent_response.verdict == 'approve'"
      - agent: "senior_engineer_human"
        condition: "calling_agent_response.requires_senior == true"
      - agent: "developer_agent"
        condition: "calling_agent_response.verdict == 'changes' and calling_agent_response.requires_senior == false and calling_agent_response.is_blocker == false"
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.is_blocker == true"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # HUMAN MEMBERS — first-class, reached in the channel they already live in.
  # Every gate DEFAULT-DENIES on timeout (fallback -> held -> audit). dual
  # belongs on the human/webhook boundary agents; NO human calls another human
  # (that would be a dual↔dual auto-bounce) — silence/hold routes to the audit
  # sink and the Manager SUPERVISOR escalates.
  # ─────────────────────────────────────────────────────────────────────────
  tech_lead_human:
    name: "tech_lead_human"
    agent_type: "human"
    is_human_powered: true
    description: "Tech lead — signs off the plan, then approves the merge. Reply 'build' to start coding, 'replan' to revise, 'merge' to ship, 'reject' to drop"
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 86400
    fallback_on_timeout: true
    fallback_response:
      human_decision: "held"
      human_message: "held_for_review"
      note: "Tech lead did not respond — held (no auto-build, no auto-merge)"
    yields:
      decision: "string"
      notes: "string"
    inputs:
      ticket_key: "string"
      ticket_url: "string"
      plan: "string"
      pr_url: "string"
    can_call:
      - agent: "developer_agent"
        condition: "calling_agent_response.human_message == 'build'"
      - agent: "dev_planner_agent"
        condition: "calling_agent_response.human_message == 'replan'"
      - agent: "merge_coordinator_agent"
        condition: "calling_agent_response.human_message == 'merge'"
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.human_message == 'reject' or calling_agent_response.human_message == 'held_for_review'"

  senior_engineer_human:
    name: "senior_engineer_human"
    agent_type: "human"
    is_human_powered: true
    description: "Senior engineer — review escalations on cross-cutting / risky changes. Reply 'approve' to send it to the merge finisher, 'request_changes' to send back to the developer"
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 43200
    fallback_on_timeout: true
    fallback_response:
      human_decision: "held"
      human_message: "held_for_review"
      note: "Senior engineer did not respond — held"
    yields:
      decision: "string"
      notes: "string"
    inputs:
      pr_url: "string"
      findings: "list"
    can_call:
      # approve → straight to the merge finisher (senior sign-off IS a merge
      # authorization; the finisher re-checks it and fails closed). NO human→human
      # edge here — that would be a dual↔dual auto-bounce.
      - agent: "merge_coordinator_agent"
        condition: "calling_agent_response.human_message == 'approve'"
      - agent: "developer_agent"
        condition: "calling_agent_response.human_message == 'request_changes'"
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.human_message == 'held_for_review' or calling_agent_response.human_message == 'reject'"

  stakeholder_human:
    name: "stakeholder_human"
    agent_type: "human"
    is_human_powered: true
    description: "Product stakeholder — signs off a groomed ticket's scope before it enters the dev queue. Reply 'approve' to queue it, 'revise' to re-groom, 'reject' to drop"
    human_interface: "default"
    communication_type: "dual"
    human_timeout_seconds: 86400
    fallback_on_timeout: true
    fallback_response:
      human_decision: "held"
      human_message: "held_for_review"
      note: "Stakeholder did not respond — held (ticket not queued)"
    yields:
      decision: "string"
      notes: "string"
    inputs:
      ticket_key: "string"
      title: "string"
      acceptance_criteria: "list"
    can_call:
      - agent: "dev_planner_agent"
        condition: "calling_agent_response.human_message == 'approve'"
      - agent: "product_owner_agent"
        condition: "calling_agent_response.human_message == 'revise'"
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.human_message == 'reject' or calling_agent_response.human_message == 'held_for_review'"

  # ─────────────────────────────────────────────────────────────────────────
  # MERGE COORDINATOR — the programmatic FINISHER / actuator behind the human
  # merge gate. It never merges on its own say-so: it re-checks that a human
  # actually approved (allow/deny tokens, fail closed on an unknown verdict),
  # enforces deterministic invariants (a PR on record, CI green, the ticket
  # known), renders the real release record to ./out, DELETES it on a tripped
  # floor, and recovers the PR/ticket across the HITL gate from the session
  # stash / dev store. See agency/merge_coordinator_agent.py.
  # ─────────────────────────────────────────────────────────────────────────
  merge_coordinator_agent:
    name: "merge_coordinator_agent"
    agent_type: "programmatic"
    description: "Merge finisher — re-checks the human approval (fail closed), gates CI, renders the release record, does the real merge, moves the ticket to Done, frees the WIP slot"
    communication_type: "chain"
    yields:
      pr_url: "string"
      ticket_id: "string"
      ticket_key: "string"
      ci_status: "string"
      approved: "boolean"
      merged: "boolean"
      needs_fix: "boolean"
      escalate: "boolean"
      artifact_path: "string"
      status: "string"          # merged | blocked | needs_fix | escalated
      block_reasons: "list"
    inputs:
      pr_url: "string"
      ticket_id: "string"
    can_call:
      # CI red / a fixable failure → back to the developer (bounded rework)
      - agent: "developer_agent"
        condition: "calling_agent_response.needs_fix == true and calling_agent_response.escalate == false"
      # Rework cap on the merge back-edge hit → a human breaks the loop
      - agent: "tech_lead_human"
        condition: "calling_agent_response.escalate == true"
      # Terminus for a merged AND a blocked outcome — the WORM record
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.merged == true or calling_agent_response.status == 'blocked'"
    auto_store_response: true
    auto_store_yields: true

  # ── AUDIT (external WORM, terminal) ─────────────────────────────
  # Hash-chained, append-only, the terminus of every path. Registered in
  # main.py via sdk.intelligence("audit_logger_agent").
  audit_logger_agent:
    name: "audit_logger_agent"
    agent_type: "external"
    description: "Hash-chained WORM — every plan, approval, PR, review, merge, and held gate. Terminus"
    framework: "custom"
    communication_type: "execute"
    connector_config:
      sink_type: "local_file"
      local_file_path: "./logs/audit.jsonl"
    yields:
      audit_event_id: "string"
      written_at_utc: "string"
      hash_chain_prev: "string"
      hash_chain_current: "string"
    inputs:
      session_id: "string"
      payload: "object"
    can_call: []
